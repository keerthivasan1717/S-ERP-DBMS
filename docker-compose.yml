services:
  mysql:
    image: mysql:8.4
    container_name: serp_mysql
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-serp_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-serp}
      MYSQL_USER: ${MYSQL_USER:-serp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-serp_password}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - serp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD:-serp_root_password} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  mongodb:
    image: mongo:6.0
    container_name: serp_mongo
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-serp}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-serp_password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-serp}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - serp_mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ping: 1})' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  serp_mysql_data:
  serp_mongo_data:
